<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aufbau Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aufbau">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Aufbau: große Titel wie iOS, gruppierte Listen, Ringe für Kalorien/Protein/Carbs, Tab-Leiste unten */
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f2f2f7; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.2);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --pink:#ff375f; --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6;
  --ring-k:#ff375f; --ring-p:#30d158; --ring-c:#5ac8fa;
  --bar:rgba(249,249,249,.88); --shadow:0 1px 2px rgba(0,0,0,.04);
  --sf:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  --sfd:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  --sfr:ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Inter", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --pink:#ff375f; --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6;
  --ring-k:#ff375f; --ring-p:#30d158; --ring-c:#64d2ff; --bar:rgba(22,22,24,.86); --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --pink:#ff375f; --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6;
  --ring-k:#ff375f; --ring-p:#30d158; --ring-c:#64d2ff; --bar:rgba(22,22,24,.86); --shadow:none; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--label);font-family:var(--sf);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 110px) max(16px,env(safe-area-inset-left,0px))}
/* Kopf */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 4px 14px}
.head h1{font-family:var(--sfd);font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.01em;margin:0}
.head .sub{color:var(--label2);font-size:15px;margin-top:2px}
.sync{font-size:12px;color:var(--label2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--label3)}
.sync.ok i{background:var(--green)}.sync.off i{background:var(--orange)}
.navbtns{display:flex;gap:8px}
.circ{width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);color:var(--blue);display:flex;align-items:center;justify-content:center}
.circ svg{width:16px;height:16px}
.circ:disabled{color:var(--label3)}
/* Gruppen */
.sec{margin:0 0 26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 16px 7px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.sec-h .act{text-transform:none;font-size:15px;color:var(--blue);background:none;border:0;padding:0;letter-spacing:-.01em}
.sec-f{margin:7px 16px 0;font-size:13px;color:var(--label2)}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:14px 16px}
.list{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;width:100%;background:none;border:0;text-align:left}
.list>.row+.row::before,.list>*+.row::before,.list>.row+*::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.list>.row.ind+.row::before,.list>.row+.row.ind::before{left:58px}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-size:17px}
.row .s{display:block;font-size:13px;color:var(--label2);margin-top:1px}
.row .r{color:var(--label2);font-size:15px;text-align:right;white-space:nowrap}
.row .r b{color:var(--label);font-weight:600}
.chev{width:8px;height:13px;color:var(--label3);flex:none}
.tint{color:var(--blue)}
/* Ringe */
.rings{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;align-items:center;padding:16px}
.rings svg{width:132px;height:132px;display:block}
.legend{display:flex;flex-direction:column;gap:9px;min-width:0}
.lg .k{font-size:13px;color:var(--label2);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.lg .v{font-family:var(--sfr);font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.lg .v small{font-size:15px;color:var(--label2);font-weight:600}
.lg.k1 .v{color:var(--ring-k)}.lg.k2 .v{color:var(--ring-p)}.lg.k3 .v{color:var(--ring-c)}
.left{display:flex;justify-content:space-between;padding:11px 16px;border-top:.5px solid var(--sep);font-size:15px;color:var(--label2)}
.left b{color:var(--label);font-weight:600}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;background:var(--card);border-radius:12px;margin-bottom:26px;box-shadow:var(--shadow)}
.banner .ic{width:30px;height:30px;border-radius:8px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.banner .ic svg{width:18px;height:18px}
.banner b{display:block;font-size:15px}
.banner span{font-size:15px;color:var(--label2)}
/* Mahlzeiten */
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--label3);background:none;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;padding:0}
.chk svg{width:14px;height:14px}
.chk[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.meal-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.meal-open .main{flex:1;min-width:0}
.done .t{color:var(--label2)}
.trainrow .ic{width:28px;height:28px;border-radius:7px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.trainrow .ic svg{width:17px;height:17px}
/* Buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:17px;background:var(--fill);color:var(--blue)}
.btn.fill{background:var(--blue);color:#fff}
.btn.small{padding:7px 13px;font-size:15px;border-radius:999px}
.btn.red{color:var(--red)}
.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scanbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:17px;background:var(--blue);color:#fff}
.scanbtn svg{width:22px;height:22px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:0;background:var(--fill);border-radius:999px;padding:7px 13px;font-size:15px;color:var(--label)}
.pill span{color:var(--label2)}
.minus{width:24px;height:24px;border-radius:50%;border:0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.minus svg{width:12px;height:12px}
/* Eingaben */
.field{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 16px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.field label{flex:1;font-size:17px}
.field input,.field select{border:0;background:none;text-align:right;font-size:17px;color:var(--label2);min-width:0;width:130px;padding:6px 0;font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus{color:var(--label);outline:none}
.field .unit{color:var(--label2);font-size:17px}
.tf{width:100%;border:0;background:var(--fill);border-radius:10px;padding:10px 12px;font-size:17px;min-width:0}
.formgrid{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px;gap:8px}
@media (max-width:420px){.formgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.formgrid .wide{grid-column:1/-1}}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 8px;font-size:13px;font-weight:600;color:var(--label);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
/* Scanner */
.scanbox{padding:14px 16px}
.scanbox .msg{font-size:15px;color:var(--label2);margin-bottom:10px}
.scanbox .msg.err{color:var(--red)}
.nut{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.nut label{display:block;font-size:12px;color:var(--label2);font-weight:600;margin:0 0 3px 2px}
.nut .tf{padding:8px 10px;font-variant-numeric:tabular-nums}
.calc{font-family:var(--sfr);font-size:15px;color:var(--label2);margin:12px 0}
.calc b{font-size:22px;color:var(--label)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--fill);border-top-color:var(--label2);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.live{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.live video{flex:1;width:100%;object-fit:cover;min-height:0}
.live .frame{position:absolute;left:12%;right:12%;top:38%;height:22%;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.live .bar{position:absolute;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.live .hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:0;right:0;text-align:center;color:#fff;font-weight:600}
/* Woche */
.dayname{width:34px;font-weight:700;font-size:15px;flex:none}
.dayname.today{color:var(--red)}
.daysel{border:0;background:none;color:var(--blue);font-size:15px;padding:0;max-width:100%;text-align:left}
/* Einkauf */
.sum{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.sum .big{font-family:var(--sfr);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.sum .s{font-size:13px;color:var(--label2)}
.prog{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin:0 16px 14px}
.prog i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.cbox{width:24px;height:24px;border-radius:50%;border:2px solid var(--label3);flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.cbox svg{width:12px;height:12px}
input.hidden-check{position:absolute;opacity:0;pointer-events:none}
.row.on .cbox{background:var(--blue);border-color:var(--blue);color:#fff}
.row.got .cbox{background:var(--label3);border-color:transparent;color:var(--card)}
.row.got .t{color:var(--label2);text-decoration:line-through}
label.row{cursor:pointer}
.tag{font-size:12px;font-weight:600;color:var(--blue);background:var(--fill2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.price{width:76px;border:0;background:var(--fill);border-radius:8px;padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.confirm{padding:12px 16px;background:var(--card);border-radius:12px;margin-top:10px}
.toast{font-size:15px;color:var(--green);font-weight:600;margin:8px 16px 0;min-height:1.2em}
.copybox{width:100%;min-height:150px;margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--card);border:0;border-radius:12px;padding:12px}
/* Analyse */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .k{font-size:13px;font-weight:600;color:var(--label2)}
.tile .v{font-family:var(--sfr);font-size:26px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .v small{font-size:15px;color:var(--label2);font-weight:600}
.tile .s{font-size:13px;color:var(--label2);margin-top:2px}
.c-k{color:var(--ring-k)}.c-p{color:var(--ring-p)}.c-c{color:var(--ring-c)}.c-g{color:var(--green)}.c-o{color:var(--orange)}.c-b{color:var(--blue)}.c-r{color:var(--red)}
.verdict{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.verdict .ic{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.verdict b{display:block;font-size:17px;margin-bottom:2px}
.verdict p{margin:0;font-size:15px;color:var(--label2)}
.verdict p+p{margin-top:6px}
.chart{padding:12px 8px 8px 4px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--label2);font-family:var(--sf);font-size:10px}
.chart .grid{stroke:var(--sep);stroke-width:1}
.chart .tgt{stroke:var(--label2);stroke-width:1.2;stroke-dasharray:4 4}
.chart .dot{fill:var(--label3)}
.chart .avg{stroke:var(--blue);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--label2);padding:0 16px 12px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.diary summary.row{padding-right:16px}
.diary details+details{position:relative}
.diary details+details::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.diary .entries{padding:0 16px 10px 16px}
.entry{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;font-size:15px;padding:6px 0;border-top:.5px solid var(--sep)}
.entry .tm{color:var(--label2);font-variant-numeric:tabular-nums}
.entry .kc{color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.entry.off .tx{color:var(--label2);text-decoration:line-through}
details[open] .chev{transform:rotate(90deg)}
.chev{transition:transform .2s}
/* Tab-Leiste im Glas-Stil: schwebende Kapsel */
.tabbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:15;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar nav{pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:5px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.38));
  -webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  border:.5px solid rgba(255,255,255,.75);
  box-shadow:0 10px 30px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 1px rgba(0,0,0,.04)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:999px;color:var(--label);opacity:.75;font-size:10.5px;font-weight:600;letter-spacing:.01em;transition:background .25s,color .25s,opacity .25s}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--blue);opacity:1;background:rgba(118,118,128,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabbar nav{background:linear-gradient(180deg,rgba(60,60,66,.62),rgba(30,30,34,.5));border-color:rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
  :root:not([data-theme="light"]) .tabbar button[aria-selected="true"]{background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}}
:root[data-theme="dark"] .tabbar nav{background:linear-gradient(180deg,rgba(60,60,66,.62),rgba(30,30,34,.5));border-color:rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
:root[data-theme="dark"] .tabbar button[aria-selected="true"]{background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
/* Rezept-Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 40px);max-width:680px;margin:0 auto;background:var(--bg);border-radius:12px 12px 0 0;overflow:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 6px}
.s-top{display:flex;justify-content:flex-end}
.s-top button{border:0;background:none;color:var(--blue);font-weight:600;font-size:17px;padding:6px 0}
.s-title{font-family:var(--sfd);font-size:28px;font-weight:700;line-height:1.15;margin:2px 4px 4px}
.s-sub{color:var(--label2);font-size:15px;margin:0 4px 16px}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center;padding:12px 4px}
.macros .v{font-family:var(--sfr);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.macros .k{font-size:12px;color:var(--label2);font-weight:600}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:11px 16px;position:relative;font-size:16px}
.steps li+li::before{content:"";position:absolute;top:0;right:0;left:52px;border-top:.5px solid var(--sep)}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
footer{color:var(--label2);font-size:13px;margin:8px 16px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  function sg(x){return (x>=0?'+':'')+nf2.format(x)}
  function periodData(n){

    for(var i=n-1;i>=0;i--){var dt=addDays(new Date(),-i),k=iso(dt),dd=wd(dt);days.push({k:k,dt:dt,today:i===0,logged:hasLog(k),eat:eatenTotals(k,dd),tgt:dayPlan(dd)[0],w:state.weights[k]})}

    var avgK=past.length?past.reduce(function(a,d){return a+d.eat[0]},0)/past.length:null;
    var avgP=past.length?past.reduce(function(a,d){return a+d.eat[1]},0)/past.length:null;
    var avgT=past.length?past.reduce(function(a,d){return a+d.tgt},0)/past.length:null;
    var pOk=past.filter(function(d){return d.eat[1]>=150}).length;
    var kOk=past.filter(function(d){return Math.abs(d.eat[0]-d.tgt)<=200}).length;

    if(ws.length>=4&&ws[ws.length-1][0]-ws[0][0]>=6){
      var mx=ws.reduce(function(a,p){return a+p[0]},0)/ws.length, my=ws.reduce(function(a,p){return a+p[1]},0)/ws.length, num=0, den=0;
      ws.forEach(function(p){num+=(p[0]-mx)*(p[1]-my);den+=(p[0]-mx)*(p[0]-mx)});
      if(den>0) slope=num/den;
    }
    var span=ws.length?ws[ws.length-1][0]-ws[0][0]:0;
    var tdee=(slope!=null&&span>=13&&past.length>=10&&avgK!=null)?Math.round((avgK-slope*7700)/10)*10:null;
    return {days:days,past:past,avgK:avgK,avgP:avgP,avgT:avgT,pOk:pOk,kOk:kOk,over:over,rate:slope!=null?slope*7:null,tdee:tdee,nW:ws.length};
  }
  function verdict(pd){

  function diaryHtml(pd){
    var byDay={}; state.journal.forEach(function(j){(byDay[j.d]=byDay[j.d]||[]).push(j)});
    var rows=pd.days.slice().reverse().filter(function(d){return d.logged||d.w!=null||byDay[d.k]});
    if(!rows.length) return '<div class="list"><div class="row"><span class="main"><span class="s">Noch keine Einträge in diesem Zeitraum.</span></span></div></div>';
    return '<div class="list diary">'+rows.map(function(d){
      var js=(byDay[d.k]||[]).slice().sort(function(a,b){return a.at-b.at});
      var head2=nf0.format(d.eat[0])+' kcal · '+nf0.format(d.eat[1])+' g P'+(d.w!=null?' · '+nf1.format(d.w)+' kg':'');
      var ent=js.map(function(j){var sameDay=iso(new Date(j.at))===j.d, tm=sameDay?hm(j.at):new Date(j.at).getDate()+'.'+(new Date(j.at).getMonth()+1)+'. '+hm(j.at);
        return '<div class="entry'+(/-off$/.test(j.ty)?' off':'')+'"><span class="tm">'+tm+'</span><span class="tx">'+esc(j.tx)+'</span><span class="kc">'+(j.k!=null?j.k+' kcal':'')+'</span></div>'}).join('');
      if(!ent) ent='<div class="entry"><span class="tm"></span><span class="tx" style="color:var(--label2)">Einträge von vor dem Tagebuch, ohne Uhrzeit.</span><span></span></div>';
      return '<details><summary class="row"><span class="main"><span class="t">'+d.dt.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})+'</span><span class="s num">'+head2+'</span></span>'+(d.logged&&!d.today?'<span class="r '+(d.eat[0]-d.tgt>200?'c-o':d.eat[0]-d.tgt<-250?'c-b':'c-g')+'">'+(d.eat[0]-d.tgt>=0?'+':'−')+nf0.format(Math.abs(d.eat[0]-d.tgt))+'</span>':'')+ICON.chev+'</summary><div class="entries">'+ent+'</div></details>';
    }).join('')+'</div>';
  }
  function viewAnalyse(){
    var pd=periodData(period), v=verdict(pd), ra=ruleAdvice();
    var colMap={g:'var(--green)',o:'var(--orange)',b:'var(--blue)',r:'var(--red)'};
    var h=head('Analyse','Fortschritt und Tagebuch');
    h+='<section class="sec"><div class="seg">'+[[7,'7 Tage'],[30,'30 Tage'],[90,'90 Tage']].map(function(p){return '<button data-act="period" data-n="'+p[0]+'" aria-pressed="'+(period===p[0])+'">'+p[1]+'</button>'}).join('')+'</div></section>';
    h+='<section class="sec"><div class="sec-h"><span>Isst du zu viel?</span></div><div class="card"><div class="verdict"><span class="ic" style="background:'+colMap[v.cls]+'">'+v.ic+'</span><div><b>'+esc(v.t)+'</b>'+v.p.map(function(x){return '<p>'+esc(x)+'</p>'}).join('')+'</div></div></div></section>';
    var w0=avgRange(0,6);
    h+='<section class="sec"><div class="tiles">'+
      '<div class="tile"><div class="k">Gewicht Ø 7 Tage</div><div class="v">'+(w0!=null?nf1.format(w0)+'<small> kg</small>':'–')+'</div><div class="s">'+(pd.rate!=null?sg(pd.rate)+' kg pro Woche':'Trend ab 4 Wiegungen')+'</div></div>'+
      '<div class="tile"><div class="k">Kalorien Ø</div><div class="v c-k">'+(pd.avgK!=null?nf0.format(pd.avgK):'–')+'</div><div class="s">'+(pd.avgT!=null?'Ziel '+nf0.format(pd.avgT)+' kcal':'noch keine Tage')+'</div></div>'+
      '<div class="tile"><div class="k">Protein Ø</div><div class="v c-p">'+(pd.avgP!=null?nf0.format(pd.avgP)+'<small> g</small>':'–')+'</div><div class="s">'+(pd.past.length?pd.pOk+' von '+pd.past.length+' Tagen ≥ 150 g':'Ziel 155 bis 165 g')+'</div></div>'+
      '<div class="tile"><div class="k">Tage im Plan</div><div class="v">'+(pd.past.length?pd.kOk+'<small> / '+pd.past.length+'</small>':'–')+'</div><div class="s">'+(pd.past.length?pd.over+' Tage deutlich drüber':'± 200 kcal zählt als im Plan')+'</div></div>'+
      '</div>'+(pd.tdee?'<div class="sec-f">Dein geschätzter Tagesbedarf aus Essen und Gewicht: <b style="color:var(--label)">ca. '+nf0.format(pd.tdee)+' kcal</b>. Für +0,25 kg pro Woche wären das etwa '+nf0.format(Math.round((pd.tdee+275)/10)*10)+' kcal.</div>':'<div class="sec-f">Gezählt werden nur vergangene Tage, an denen du etwas eingetragen hast.</div>')+'</section>';
    if(ra) h+='<section class="sec"><div class="sec-h"><span>Empfehlung nach deinen Regeln</span></div><div class="card"><div class="verdict"><span class="ic" style="background:'+colMap[ra.cls]+'">'+(ra.cls==='g'?'✓':ra.cls==='o'?'↓':'↑')+'</span><div><b>'+esc(ra.t)+'</b><p>'+esc(ra.p)+'</p>'+(ra.act!=null?'<button class="btn fill small" style="margin-top:10px" data-act="step" data-s="'+ra.act+'">Auf Stufe '+STEPS[ra.act].n+' wechseln</button>':'')+'</div></div></div><div class="sec-f">Aktuell: Stufe '+STEPS[state.step].n+'. Vergleich der letzten 7 Tage mit der Woche davor.</div></section>';
    h+='<section class="sec"><div class="sec-h"><span>Gewicht</span></div><div class="card chart">'+weightChart(pd)+'</div><div class="sec-f">Punkte sind einzelne Wiegungen, die Linie ist der 7 Tage Schnitt.</div></section>';
    h+='<section class="sec"><div class="sec-h"><span>Kalorien pro Tag</span></div><div class="card"><div class="chart">'+kcalChart(pd)+'</div><div class="chart-legend"><span><i style="background:var(--green)"></i>im Plan</span><span><i style="background:var(--orange)"></i>über 200 drüber</span><span><i style="background:var(--blue)"></i>über 250 drunter</span><span>gestrichelt: Ziel</span></div></div></section>';
    h+='<section class="sec"><div class="sec-h"><span>Tagebuch</span></div>'+diaryHtml(pd)+'<div class="sec-f">Jede Eingabe wird automatisch mit Uhrzeit gespeichert. Tag antippen für Details.</div></section>';
    h+='<section class="sec"><div class="sec-h"><span>Daten</span></div><div class="list"><button class="row" data-act="bk-copy"><span class="main"><span class="t tint">Backup kopieren</span></span></button><button class="row" data-act="bk-paste"><span class="main"><span class="t tint">Backup einfügen</span></span></button></div>'+
      (backupMode==='paste'?'<div class="card pad" style="margin-top:10px"><textarea class="copybox" id="bk-in" style="margin:0;background:var(--fill)" placeholder="Backup hier einfügen" aria-label="Backup einfügen"></textarea><div class="btnrow" style="margin-top:10px"><button class="btn fill small" data-act="bk-apply">Übernehmen</button><button class="btn small" data-act="bk-cancel">Abbrechen</button></div><div class="sec-f" style="margin:8px 0 0">Ersetzt alle Daten in der App.</div></div>':'')+
      (backupMode==='show'?'<textarea class="copybox" id="bk-out" readonly aria-label="Backup">'+esc(JSON.stringify(state))+'</textarea>':'')+
      (backupMsg?'<div class="toast">'+esc(backupMsg)+'</div>':'')+'</section>';
    h+='<footer>Makros pro Portion, Reis, Nudeln und Haferflocken roh gewogen. Gewürze, Zwiebel und Knoblauch sind nicht mitgerechnet.</footer>';
    return h;
  }

  /* ---------- Rezept-Sheet ---------- */
  var sheet=document.getElementById('sheet'), backdrop=document.getElementById('backdrop'), sheetRid=null, sheetBatch=false, lastFocus=null;
  function batchSize(rid){var i=PLANS.A.indexOf(rid);if(i<0)i=PLANS.B.indexOf(rid);return i<0?0:(i===0?4:3)}
  function sheetHtml(rid){
    var r=R[rid], m=macros(rid), ex=r.x&&extraOn(r.s)?r.x:null, b=r.s==='m'?batchSize(rid):0, mult=sheetBatch&&b?b:1;
    var h='<div class="grab"></div><div class="s-top"><button data-act="close">Fertig</button></div><h2 class="s-title" id="s-title">'+esc(r.n)+'</h2><div class="s-sub">'+esc(SLOTNAME[r.s])+' · '+r.t+' Minuten'+(ex?' · mit Stufe '+STEPS[state.step].n:'')+'</div>'+
      '<section class="sec"><div class="card macros"><div><div class="v c-k">'+m[0]+'</div><div class="k">kcal</div></div><div><div class="v c-p">'+m[1]+'</div><div class="k">Protein</div></div><div><div class="v c-c">'+m[2]+'</div><div class="k">Carbs</div></div><div><div class="v" style="color:var(--purple)">'+m[3]+'</div><div class="k">Fett</div></div></div><div class="sec-f">pro Portion</div></section>';
    if(b) h+='<section class="sec"><div class="seg"><button data-act="batch" data-b="0" aria-pressed="'+!sheetBatch+'">1 Portion</button><button data-act="batch" data-b="1" aria-pressed="'+sheetBatch+'">'+b+' Portionen</button></div></section>';
    h+='<section class="sec"><div class="sec-h"><span>Zutaten'+(mult>1?' für '+mult+' Portionen':'')+'</span></div><div class="list">'+r.ing.map(function(g){
      var a=g[1], plus=ex&&ex[0]===g[0]?ex[1]:0, txt=a==null?'etwas':nf.format((a+plus)*mult)+(g[2]?' '+g[2]:'');
      return '<div class="row"><span class="main"><span class="t">'+esc(g[3])+'</span>'+(plus?'<span class="s" style="color:var(--orange)">inklusive +'+nf.format(plus*mult)+' '+g[2]+' durch die Stufe</span>':'')+'</span><span class="r num"><b>'+esc(txt)+'</b></span></div>';
    }).join('')+'</div></section><section class="sec"><div class="sec-h"><span>Zubereitung</span></div><ol class="list steps">'+r.st.map(function(t,i){return '<li><span class="n">'+(i+1)+'</span><span>'+esc(t)+'</span></li>'}).join('')+'</ol>'+(r.tip?'<div class="sec-f">'+esc(r.tip)+'</div>':'')+'</section>';
    return h;
  }
  function openSheet(rid){lastFocus=document.activeElement;if(sheetRid!==rid)sheetBatch=false;sheetRid=rid;sheet.innerHTML=sheetHtml(rid);sheet.hidden=false;backdrop.hidden=false;sheet.scrollTop=0;document.body.style.overflow='hidden';sheet.focus()}
  function closeSheet(){sheet.hidden=true;backdrop.hidden=true;document.body.style.overflow='';if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}
  backdrop.addEventListener('click',closeSheet);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!sheet.hidden)closeSheet();if(!liveEl.hidden)stopLive()}});
  sheet.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='close')closeSheet();if(b.dataset.act==='batch'){sheetBatch=b.dataset.b==='1';sheet.innerHTML=sheetHtml(sheetRid)}});

  /* ---------- Aktionen ---------- */
  function copy(txt,ok,fail){try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fail)}else fail()}catch(x){fail()}}
  main.addEventListener('click',function(e){
    var rb=e.target.closest('[data-recipe]'); if(rb&&rb.tagName!=='SELECT'){openSheet(rb.dataset.recipe);return}
    var b=e.target.closest('[data-act]'); if(!b||b.tagName==='INPUT'||b.tagName==='SELECT') return;
    var a=b.dataset.act, dt=addDays(new Date(),heuteOffset), k=iso(dt), d=wd(dt);
    if(a==='scan'){if(CAN_LIVE)startLive();else{var fi=document.getElementById('scanfile');fi.value='';fi.click()}return}
    if(a==='scan-photo'){var fi2=document.getElementById('scanfile');fi2.value='';fi2.click();return}
    if(a==='scan-manual'){editStage({ean:scan.pendingEan||null,n:'',k:'',p:'',c:'',f:''});return}
    if(a==='scan-cancel'){scan={stage:'idle'};render();return}
    if(a==='scan-g'){scan.g=+b.dataset.g;render();return}
    if(a==='prod'){openProduct(b.dataset.id);window.scrollTo({top:main.querySelector('.scanbox')?main.querySelector('.scanbox').getBoundingClientRect().top+window.scrollY-80:0,behavior:'smooth'});return}
    if(a==='scan-del'){delete state.products[scan.id];scan={stage:'idle'};commit();render();return}
    if(a==='scan-save'){scanSave(k);return}
    if(a==='day'){heuteOffset=Math.max(-30,Math.min(6,heuteOffset+(+b.dataset.n)));weighOpen=false;scan={stage:'idle'};render();return}
    if(a==='weigh-edit'){weighOpen=true;render();var wi=document.getElementById('wkg');if(wi)wi.focus();return}
    if(a==='weigh-cancel'){weighOpen=false;render();return}
    if(a==='eat'){
      var l=logOf(k,true),s=b.dataset.slot,meal=dayMeals(d).filter(function(x){return x.slot===s})[0];
      if(l.e[s]){var mm=mealMacros(l.e[s],meal.rid);delete l.e[s];jlog(k,'meal-off',SLOTNAME[s]+' wieder entfernt: '+R[meal.rid].n,mm[0],mm[1])}
      else{var m=macros(meal.rid);l.e[s]={r:meal.rid,m:m};jlog(k,'meal',SLOTNAME[s]+': '+R[meal.rid].n,m[0],m[1])}
      commit();render();return;
    }
    if(a==='all'){var l2=logOf(k,true);dayMeals(d).forEach(function(x){if(x.rid&&!l2.e[x.slot]){var m2=macros(x.rid);l2.e[x.slot]={r:x.rid,m:m2};jlog(k,'meal',SLOTNAME[x.slot]+': '+R[x.rid].n,m2[0],m2[1])}});commit();render();return}
    if(a==='quick'){var q=QUICK[+b.dataset.i];logOf(k,true).x.push({n:q[0],k:q[1],p:q[2]});jlog(k,'extra',q[0],q[1],q[2]);commit();render();return}
    if(a==='delx'){var l3=logOf(k);if(l3){var xr=l3.x.splice(+b.dataset.i,1)[0];if(xr)jlog(k,'extra-off',xr.n+' gelöscht',xr.k,xr.p);commit();render()}return}
    if(a==='plan'){state.plan=b.dataset.p;commit();render();return}
    if(a==='step'){var old=state.step;state.step=+b.dataset.s;if(old!==state.step)jlog(iso(new Date()),'set','Kalorienstufe '+STEPS[old].n+' auf '+STEPS[state.step].n);commit();render();return}
    if(a==='period'){period=+b.dataset.n;render();return}
    if(a==='copy'){
      var txt=shopText(), fb=function(){copyText=txt;shopToast='Text markiert, jetzt kopieren';render();var bx=document.getElementById('copybox');if(bx){bx.focus();bx.select()}};
      copy(txt,function(){copyText='';shopToast='Kopiert, in Notizen einfügen';render()},fb);return;
    }
    if(a==='done'){document.getElementById('done-confirm').hidden=false;return}
    if(a==='done-no'){document.getElementById('done-confirm').hidden=true;return}
    if(a==='done-yes'){state.shop={};state.vorrat={};state.extras={};copyText='';shopToast='Bereit für die nächste Woche';commit();render();return}
    if(a==='bk-copy'){var j=JSON.stringify(state);copy(j,function(){backupMode='';backupMsg='Backup kopiert';render()},function(){backupMode='show';backupMsg='Text markiert, jetzt kopieren';render();var o=document.getElementById('bk-out');if(o){o.focus();o.select()}});return}
    if(a==='bk-paste'){backupMode='paste';backupMsg='';render();return}
    if(a==='bk-cancel'){backupMode='';backupMsg='';render();return}
    if(a==='bk-apply'){try{var inp=JSON.parse(document.getElementById('bk-in').value);if(!inp||typeof inp!=='object'||!inp.dinner)throw 0;state=normalize(inp);backupMode='';backupMsg='Backup übernommen';commit();render()}catch(x){backupMsg='Das ist kein gültiges Backup';render()}return}
  });
  main.addEventListener('change',function(e){
    var t=e.target, a=t.dataset.act; if(!a) return;
    if(a==='dinner'){state.dinner[+t.dataset.d]=t.value;commit();render();return}
    if(a==='train'){state.train=t.value;commit();render();return}
    if(a==='shop'){if(t.checked)state.shop[t.dataset.id]=1;else delete state.shop[t.dataset.id];commit();render();return}
    if(a==='vorrat'){if(t.checked)state.vorrat[t.dataset.id]=1;else delete state.vorrat[t.dataset.id];commit();render();return}
    if(a==='extra'){if(t.checked)state.extras[t.dataset.id]=1;else delete state.extras[t.dataset.id];commit();render();return}
    if(a==='price'){var v=parseFloat(String(t.value).replace(',','.'));if(isFinite(v)&&v>=0)state.prices[t.dataset.id]=v;else delete state.prices[t.dataset.id];commit();render();return}
  });
  main.addEventListener('input',function(e){
    var t=e.target, s=t.dataset.scan; if(!s||scan.stage!=='edit') return;
    if(s==='g') scan.g=t.value; else scan.prod[s]=t.value;
    var el=document.getElementById('scalc'); if(el) el.innerHTML=calcTxt(scanCalc());
  });
  main.addEventListener('submit',function(e){
    e.preventDefault();
    var k=iso(addDays(new Date(),heuteOffset));
    if(e.target.id==='wform'){
      var v=parseFloat(String(document.getElementById('wkg').value).replace(',','.')), tm=nowHM();
      if(!isFinite(v)||v<30||v>250) return;
      var old=state.weights[k];
      state.weights[k]=Math.round(v*10)/10; state.wtime[k]=tm;
      jlog(k,'weight','Gewicht '+nf1.format(state.weights[k])+' kg, gewogen um '+tm+(old!=null&&old!==state.weights[k]?' (vorher '+nf1.format(old)+')':''));
      weighOpen=false;commit();render();return;
    }
    if(e.target.id==='xform'){
      var n=document.getElementById('xn').value.trim()||'Extra', kc=parseFloat(document.getElementById('xk').value), p=parseFloat(document.getElementById('xp').value)||0;
      if(!isFinite(kc)||kc<=0) return;
      logOf(k,true).x.push({n:n.slice(0,60),k:Math.round(kc),p:Math.round(p)});jlog(k,'extra',n,kc,p);commit();render();
    }
  });

  render();
  if(!IN_CLAUDE&&location.protocol==='https:'){
    try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  }
})();
</script>
</body>
</html>
